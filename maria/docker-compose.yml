version: '3.5'

services:
  mariadb:
    env_file:
      - ../.env
    build: ./.
    container_name: mariadb
    image: mariadb:abouazi
    restart: always
    volumes:
      - db_volume:/var/lib/mysql
    networks:
     - g_network

volumes:
  db_volume:
    name: db_volume

networks:
  g_network:
   name: g_network
