version: '3.5'

services:
  mariadb:
    env_file:
      - ../.env
    build: ./requirements/mariadb
    container_name: mariadb
    image: mariadb:abouazi
    restart: always
    volumes:
      - db_volume:/var/lib/mysql
    networks:
     - g_network

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    image: nginx:abouazi
    ports:
      - '443:443'
    restart: always
    depends_on:
      - wordpress
    volumes:
      - wp_volume:/var/www/html
    networks:
      - g_network

  wordpress:
    env_file:
      - ../.env
    build: ./requirements/wordpress
    container_name: wordpress
    image: wordpress:abouazi
    depends_on:
      - mariadb
    restart: always
    volumes:
      - wp_volume:/var/www/html
    networks:
      - g_network
    ports:
      - "9000:9000"

volumes:
  db_volume:
    name: db_volume
  wp_volume:
    name: wp_volume

networks:
  g_network:
   name: g_network
